---
# Input files
input: /home/oiher/longGWAS/longitudinal-GWAS-pipeline/example/genotype/chr[1-3].vcf
covarfile: /home/oiher/longGWAS/longitudinal-GWAS-pipeline/example/covariates.tsv
phenofile: /home/oiher/longGWAS/longitudinal-GWAS-pipeline/example/phenotype.surv.tsv

#Variables names
pheno_name: surv_y
covariates: "SEX age_at_baseline"
study_col: study_arm
