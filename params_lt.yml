---
# Input files
input: ${projectDir}/example/genotype/chr[1-3].vcf
covarfile: ${projectDir}/example/covariates.tsv
phenofile: ${projectDir}/example/phenotype.lt.tsv

#Variables names
pheno_name: y
covariates: "SEX age_at_baseline"
study_col: study_arm
time_col: study_days

# Model variables
longitudinal_flag: true
survival_flag: false
linear_flag: false
chunk_flag: true
chunk_size: 60000
plink_chunk_size: 10000
# model: cph
# out: output

# Parameters for genetic QC
r2thres: -9
minor_allele_freq: "0.05"
minor_allele_ct: "20"
kinship: "0.177"
ancestry: "EUR"
assembly: "hg19"
#Identifier for the input genotype files - useful to cache results
dataset: "LONG_LMM"

# Generate manhattan with result files
mh_plot: true